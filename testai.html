<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #090d16;
            --bg-secondary: #131b2e;
            --bg-tertiary: #1c2742;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --user-msg: #4f46e5;
            --bot-msg: #1e293b;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        /* Header */
        header {
            padding: 18px 24px;
            background: rgba(19, 27, 46, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .bot-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .details h2 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .details p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            text-decoration: none;
        }

        .icon-btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        /* Chat Window */
        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bot-msg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        /* Input Area */
        .input-container {
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }

        .input-container input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .input-container input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .send-btn {
            background: var(--accent);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        /* Modals */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            width: 90%;
            max-width: 450px;
            padding: 24px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-content h3 {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 10px;
            color: #fff;
            outline: none;
        }

        .error-msg {
            color: var(--error);
            font-size: 0.8rem;
            display: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="chat-container">
        <header>
            <div class="bot-info">
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="details">
                    <h2 id="display-bot-name">AI Assistant</h2>
                    <p>Created by <span id="display-owner">Owner</span></p>
                </div>
            </div>
            <div class="header-actions">
                <a id="wa-link" href="#" target="_blank" class="icon-btn" title="WhatsApp Channel">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
                <button class="icon-btn" onclick="clearMemory()" title="Clear Memory">
                    <i class="fa-solid fa-trash"></i>
                </button>
                <button class="icon-btn" onclick="openAdminPortal()" title="Admin Configuration">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </header>

        <div class="chat-box" id="chat-box"></div>

        <div class="input-container">
            <input type="text" id="user-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <h3>Admin Login</h3>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login-username" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter password">
            </div>
            <div class="error-msg" id="login-error">Invalid username or password.</div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="toggleModal('login-modal', false)">Cancel</button>
                <button class="btn btn-primary" onclick="verifyLogin()">Login</button>
            </div>
        </div>
    </div>

    <!-- Configuration Modal -->
    <div class="modal" id="config-modal">
        <div class="modal-content">
            <h3>Custom Configuration</h3>
            <div class="form-group">
                <label>AI Name</label>
                <input type="text" id="cfg-bot-name">
            </div>
            <div class="form-group">
                <label>Owner Name</label>
                <input type="text" id="cfg-owner">
            </div>
            <div class="form-group">
                <label>WhatsApp Channel URL</label>
                <input type="text" id="cfg-wa-link">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="toggleModal('config-modal', false)">Cancel</button>
                <button class="btn btn-primary" onclick="saveSettings()">Save Configuration</button>
            </div>
        </div>
    </div>

    <script>
        const CREDENTIALS = {
            user: "admin",
            pass: "Minato5151@"
        };

        const defaultConfig = {
            botName: "LUXURY AI V1",
            owner: "LordMinato",
            waLink: "https://whatsapp.com/channel/example"
        };

        let config = JSON.parse(localStorage.getItem('ai_bot_config')) || defaultConfig;
        let chatMemory = JSON.parse(localStorage.getItem('ai_bot_memory')) || [];

        window.onload = () => {
            applyConfig();
            loadChatHistory();
        };

        function applyConfig() {
            document.getElementById('display-bot-name').innerText = config.botName;
            document.getElementById('display-owner').innerText = config.owner;
            document.getElementById('wa-link').href = config.waLink;

            document.getElementById('cfg-bot-name').value = config.botName;
            document.getElementById('cfg-owner').value = config.owner;
            document.getElementById('cfg-wa-link').value = config.waLink;
        }

        function toggleModal(id, show) {
            document.getElementById(id).style.display = show ? 'flex' : 'none';
        }

        function openAdminPortal() {
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('login-error').style.display = 'none';
            toggleModal('login-modal', true);
        }

        function verifyLogin() {
            const user = document.getElementById('login-username').value;
            const pass = document.getElementById('login-password').value;

            if (user === CREDENTIALS.user && pass === CREDENTIALS.pass) {
                toggleModal('login-modal', false);
                toggleModal('config-modal', true);
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function saveSettings() {
            config.botName = document.getElementById('cfg-bot-name').value || defaultConfig.botName;
            config.owner = document.getElementById('cfg-owner').value || defaultConfig.owner;
            config.waLink = document.getElementById('cfg-wa-link').value || defaultConfig.waLink;

            localStorage.setItem('ai_bot_config', JSON.stringify(config));
            applyConfig();
            toggleModal('config-modal', false);
        }

        function renderMessage(text, sender) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function loadChatHistory() {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            if (chatMemory.length === 0) {
                renderMessage(`Hello! I am ${config.botName}, managed by ${config.owner}. How can I help you today?`, 'bot');
            } else {
                chatMemory.forEach(msg => renderMessage(msg.text, msg.sender));
            }
        }

        function saveToMemory(text, sender) {
            chatMemory.push({ text, sender });
            localStorage.setItem('ai_bot_memory', JSON.stringify(chatMemory));
        }

        function clearMemory() {
            if (confirm("Clear chat memory history?")) {
                chatMemory = [];
                localStorage.removeItem('ai_bot_memory');
                loadChatHistory();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;

            renderMessage(text, 'user');
            saveToMemory(text, 'user');
            inputField.value = '';

            const loadingId = 'loading-' + Date.now();
            const chatBox = document.getElementById('chat-box');
            const loadingDiv = document.createElement('div');
            loadingDiv.classList.add('message', 'bot');
            loadingDiv.id = loadingId;
            loadingDiv.innerText = "Thinking...";
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://luxurystudioweb.com/test.php?text=${encodeURIComponent(text)}`);
                const data = await response.json();
                
                const botReply = data.data || "No response received.";

                document.getElementById(loadingId).remove();
                renderMessage(botReply, 'bot');
                saveToMemory(botReply, 'bot');
            } catch (error) {
                document.getElementById(loadingId).remove();
                const errorMsg = "Failed to connect to the server.";
                renderMessage(errorMsg, 'bot');
            }
        }
    </script>
</body>
</html>
